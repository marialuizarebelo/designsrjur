<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700;800&display=swap">
  <style>
    body { margin: 0; }
    a { color: #C06A54; } a:hover { color: #D98670; }
  </style>
</helmet>
<div style="--cream:#F5F1E6; --coral:#A8503C; --coral-glow:#C06A54; --text-2:#98A2BC; --glass:rgba(245,241,230,0.05); --glass-b:rgba(245,241,230,0.12); width:1200px; height:1080px; box-sizing:border-box; background:linear-gradient(160deg, #0B1526 0%, #14213D 55%, #1E3159 100%); font-family:'Manrope',sans-serif; padding:72px; display:flex; flex-direction:column; gap:32px; position:relative; overflow:hidden;">

  <div style="position:absolute; top:-200px; right:-180px; width:540px; height:540px; border-radius:50%; background:radial-gradient(circle, rgba(38,64,110,0.5), rgba(38,64,110,0) 70%); filter:blur(20px);"></div>

  <div style="display:flex; flex-direction:column; gap:8px; position:relative;">
    <span style="font-size:12px; font-weight:700; letter-spacing:0.18em; color:var(--coral-glow); text-transform:uppercase;">05 — Componentes</span>
    <h2 style="margin:0; font-family:'Instrument Serif', serif; font-weight:400; font-size:52px; color:var(--cream);">Do sistema (SaaS)</h2>
  </div>

  <div style="display:flex; flex-direction:column; gap:14px; position:relative;">
    <span style="font-size:12px; font-weight:700; letter-spacing:0.1em; color:var(--cream); text-transform:uppercase;">Botões</span>
    <div style="display:flex; align-items:center; gap:16px;">
      <div style="background:linear-gradient(160deg, var(--coral-glow), var(--coral)); color:var(--cream); font-size:14px; font-weight:700; padding:13px 24px; border-radius:14px; box-shadow:0 16px 30px -14px rgba(168,80,60,0.55);">+ Novo Cliente</div>
      <div style="background:var(--glass); backdrop-filter:blur(20px); color:var(--cream); font-size:14px; font-weight:700; padding:13px 24px; border-radius:14px; border:1px solid var(--glass-b);">Exportar</div>
      <div style="background:transparent; color:var(--text-2); font-size:14px; font-weight:700; padding:13px 24px;">Cancelar</div>
    </div>
  </div>

  <div style="display:flex; flex-direction:column; gap:14px; position:relative;">
    <span style="font-size:12px; font-weight:700; letter-spacing:0.1em; color:var(--cream); text-transform:uppercase;">Etiquetas de status</span>
    <div style="display:flex; align-items:center; gap:12px;">
      <div style="background:rgba(110,156,125,0.2); color:#8FC7A2; font-size:12px; font-weight:700; padding:7px 16px; border-radius:999px;">ATIVO</div>
      <div style="background:rgba(217,164,65,0.2); color:#E8C275; font-size:12px; font-weight:700; padding:7px 16px; border-radius:999px;">PENDENTE</div>
      <div style="background:rgba(217,108,135,0.2); color:#E794A9; font-size:12px; font-weight:700; padding:7px 16px; border-radius:999px;">ATRASADO</div>
      <div style="background:rgba(133,119,201,0.2); color:#B0A5E8; font-size:12px; font-weight:700; padding:7px 16px; border-radius:999px;">CONSULTIVO</div>
    </div>
  </div>

  <div style="display:flex; flex-direction:column; gap:14px; position:relative;">
    <span style="font-size:12px; font-weight:700; letter-spacing:0.1em; color:var(--cream); text-transform:uppercase;">Campo de formulário</span>
    <div style="display:flex; flex-direction:column; gap:8px; max-width:420px;">
      <span style="font-size:13px; font-weight:600; color:var(--cream);">Nome do cliente</span>
      <div style="background:var(--glass); backdrop-filter:blur(20px); border:1px solid var(--glass-b); border-radius:14px; padding:14px 18px; font-size:14px; color:var(--text-2);">Ex: Carolina Zatti</div>
    </div>
  </div>

  <div style="display:flex; flex-direction:column; gap:14px; flex:1; position:relative;">
    <span style="font-size:12px; font-weight:700; letter-spacing:0.1em; color:var(--cream); text-transform:uppercase;">Cartão de processo</span>
    <div style="background:var(--glass); backdrop-filter:blur(24px); border:1px solid var(--glass-b); border-radius:22px; padding:22px; max-width:420px; display:flex; flex-direction:column; gap:12px; box-shadow:0 20px 50px -30px rgba(0,0,0,0.6); position:relative;">
      <div style="position:absolute; top:22px; bottom:22px; left:0; width:4px; border-radius:0 4px 4px 0; background:linear-gradient(180deg, var(--coral-glow), var(--coral));"></div>
      <div style="display:flex; align-items:center; justify-content:space-between; padding-left:8px;">
        <span style="font-size:15px; font-weight:700; color:var(--cream);">Inventário Judicial</span>
        <div style="width:28px; height:28px; border-radius:50%; background:linear-gradient(160deg, #26406E, #14213D); flex-shrink:0;"></div>
      </div>
      <span style="font-size:12px; color:var(--text-2); padding-left:8px;">5002031-56.2026.8.21.3001</span>
      <span style="font-size:13px; color:var(--cream); padding-left:8px;">Luana Castro do Couto</span>
      <div style="background:rgba(133,119,201,0.2); color:#B0A5E8; font-size:11px; font-weight:700; padding:5px 14px; border-radius:999px; width:fit-content; margin-left:8px;">CÍVEL</div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
