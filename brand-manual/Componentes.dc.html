<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700;800&display=swap">
  <style>
    body { margin: 0; }
    a { color: #DD7860; } a:hover { color: #C4614A; }
  </style>
</helmet>
<div style="--navy:#14213D; --cream:#F7F2E7; --coral:#DD7860; --coral-dark:#C4614A; --text:#1A2333; --text-2:#857C6E; --line:#E5DFD0; width:1200px; height:1080px; box-sizing:border-box; background:var(--cream); font-family:'Manrope',sans-serif; padding:72px; display:flex; flex-direction:column; gap:32px;">

  <div style="display:flex; flex-direction:column; gap:8px;">
    <span style="font-size:12px; font-weight:700; letter-spacing:0.16em; color:var(--coral); text-transform:uppercase;">05 — Componentes</span>
    <h2 style="margin:0; font-family:'Instrument Serif', serif; font-weight:400; font-size:52px; color:var(--navy);">Do sistema (SaaS)</h2>
  </div>

  <div style="display:flex; flex-direction:column; gap:14px;">
    <span style="font-size:12px; font-weight:700; letter-spacing:0.1em; color:var(--navy); text-transform:uppercase;">Botões</span>
    <div style="display:flex; align-items:center; gap:16px;">
      <div style="background:var(--coral); color:#FBF8F1; font-size:14px; font-weight:700; padding:12px 22px; border-radius:8px;">+ Novo Cliente</div>
      <div style="background:transparent; color:var(--navy); font-size:14px; font-weight:700; padding:12px 22px; border-radius:8px; border:1.5px solid var(--navy);">Exportar</div>
      <div style="background:transparent; color:var(--text-2); font-size:14px; font-weight:700; padding:12px 22px;">Cancelar</div>
    </div>
  </div>

  <div style="display:flex; flex-direction:column; gap:14px;">
    <span style="font-size:12px; font-weight:700; letter-spacing:0.1em; color:var(--navy); text-transform:uppercase;">Etiquetas de status</span>
    <div style="display:flex; align-items:center; gap:12px;">
      <div style="background:rgba(110,156,125,0.15); color:#4C7A5D; font-size:12px; font-weight:700; padding:6px 14px; border-radius:999px;">ATIVO</div>
      <div style="background:rgba(217,164,65,0.18); color:#9C7620; font-size:12px; font-weight:700; padding:6px 14px; border-radius:999px;">PENDENTE</div>
      <div style="background:rgba(217,108,135,0.16); color:#B14D68; font-size:12px; font-weight:700; padding:6px 14px; border-radius:999px;">ATRASADO</div>
      <div style="background:rgba(133,119,201,0.16); color:#5F52A8; font-size:12px; font-weight:700; padding:6px 14px; border-radius:999px;">CONSULTIVO</div>
    </div>
  </div>

  <div style="display:flex; flex-direction:column; gap:14px;">
    <span style="font-size:12px; font-weight:700; letter-spacing:0.1em; color:var(--navy); text-transform:uppercase;">Campo de formulário</span>
    <div style="display:flex; flex-direction:column; gap:8px; max-width:420px;">
      <span style="font-size:13px; font-weight:600; color:var(--text);">Nome do cliente</span>
      <div style="background:#FBF8F1; border:1.5px solid var(--line); border-radius:8px; padding:14px 16px; font-size:14px; color:var(--text-2);">Ex: Carolina Zatti</div>
    </div>
  </div>

  <div style="display:flex; flex-direction:column; gap:14px; flex:1;">
    <span style="font-size:12px; font-weight:700; letter-spacing:0.1em; color:var(--navy); text-transform:uppercase;">Cartão de processo</span>
    <div style="background:#FBF8F1; border:1px solid var(--line); border-left:3px solid var(--coral); border-radius:8px; padding:20px; max-width:420px; display:flex; flex-direction:column; gap:10px;">
      <div style="display:flex; align-items:center; justify-content:space-between;">
        <span style="font-size:15px; font-weight:700; color:var(--navy);">Inventário Judicial</span>
        <div style="width:26px; height:26px; border-radius:50%; background:var(--navy); flex-shrink:0;"></div>
      </div>
      <span style="font-size:12px; color:var(--text-2);">5002031-56.2026.8.21.3001</span>
      <span style="font-size:13px; color:var(--text);">Luana Castro do Couto</span>
      <div style="background:rgba(133,119,201,0.16); color:#5F52A8; font-size:11px; font-weight:700; padding:4px 12px; border-radius:999px; width:fit-content;">CÍVEL</div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
