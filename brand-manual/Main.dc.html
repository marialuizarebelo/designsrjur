<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700;800&display=swap">
  <style>
    body { margin: 0; }
    a { color: #DD7860; } a:hover { color: #C4614A; }
  </style>
</helmet>
<div style="--navy:#14213D; --cream:#F7F2E7; --coral:#DD7860; --text-2:#857C6E; width:1200px; height:900px; box-sizing:border-box; background:var(--cream); font-family:'Manrope',sans-serif; display:flex; flex-direction:column; justify-content:space-between; padding:72px; position:relative; overflow:hidden;">

  <div style="position:absolute; top:-180px; right:-180px; width:520px; height:520px; border-radius:50%; background:radial-gradient(circle at 30% 30%, rgba(221,120,96,0.16), rgba(221,120,96,0) 70%);"></div>

  <div style="display:flex; align-items:center; justify-content:space-between;">
    <div style="display:flex; align-items:center; gap:10px;">
      <span style="font-size:12px; font-weight:700; letter-spacing:0.16em; color:var(--coral); text-transform:uppercase;">Manual de marca</span>
    </div>
    <div style="width:52px; height:52px; border-radius:12px; background:var(--navy); display:flex; align-items:center; justify-content:center;">
      <svg viewBox="0 0 24 24" fill="none" stroke="#F7F2E7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" width="26" height="26">
        <path d="M12 3v18M7 21h10M5 7l3-2 3 2M13 7l3-2 3 2M3 7l2 5a2 2 0 0 0 4 0L7 7M15 7l2 5a2 2 0 0 0 4 0l-2-5"></path>
      </svg>
    </div>
  </div>

  <div style="display:flex; flex-direction:column; gap:24px;">
    <h1 style="margin:0; font-family:'Instrument Serif', serif; font-style:italic; font-weight:400; font-size:172px; line-height:0.92; color:var(--navy); letter-spacing:-0.01em;">SRJUR</h1>
    <div style="display:flex; align-items:center; gap:16px;">
      <div style="width:56px; height:2px; background:var(--coral);"></div>
      <p style="margin:0; font-size:19px; color:#3A3226; max-width:520px; line-height:1.5;">Advocacia com clareza — do escritório ao hub digital.</p>
    </div>
  </div>

  <div style="display:flex; align-items:baseline; justify-content:space-between; border-top:1px solid #E5DFD0; padding-top:24px;">
    <span style="font-size:12px; letter-spacing:0.1em; color:var(--text-2); text-transform:uppercase;">Scartezzini &amp; Rebelo Advocacia</span>
    <span style="font-size:12px; letter-spacing:0.1em; color:var(--text-2); text-transform:uppercase;">Versão 01 · 2026</span>
  </div>
</div>
</x-dc>
</body>
</html>
