<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Italiana&family=Manrope:wght@400;500;600;700;800&display=swap">
  <style>
    body { margin: 0; }
    a { color: #A6565A; } a:hover { color: #BF7276; }
  </style>
</helmet>
<div style="--navy:#0F1B33; --navy-2:#1A2C52; --navy-3:#26406E; --cream:#F5F1E6; --coral:#8B3F42; --coral-glow:#A6565A; --text-2:#98A2BC; width:1200px; height:900px; box-sizing:border-box; background:linear-gradient(160deg, #0B1526 0%, #14213D 55%, #1E3159 100%); font-family:'Manrope',sans-serif; display:flex; flex-direction:column; justify-content:space-between; padding:72px; position:relative; overflow:hidden;">

  <div style="position:absolute; top:-220px; right:-160px; width:620px; height:620px; border-radius:50%; background:radial-gradient(circle, rgba(139,63,66,0.28), rgba(139,63,66,0) 70%); filter:blur(30px);"></div>
  <div style="position:absolute; bottom:-260px; left:-140px; width:560px; height:560px; border-radius:50%; background:radial-gradient(circle, rgba(38,64,110,0.55), rgba(38,64,110,0) 70%); filter:blur(20px);"></div>

  <div style="display:flex; align-items:center; justify-content:space-between; position:relative;">
    <div style="display:flex; align-items:center; gap:10px;">
      <span style="font-size:12px; font-weight:700; letter-spacing:0.18em; color:var(--coral-glow); text-transform:uppercase;">Manual de marca</span>
    </div>
    <div style="width:56px; height:56px; border-radius:50%; background:linear-gradient(160deg, #26406E, #14213D); box-shadow:0 0 0 1px rgba(245,241,230,0.22) inset, 0 20px 50px -20px rgba(0,0,0,0.6); display:flex; align-items:center; justify-content:center;">
      <span style="font-family:'Italiana', serif; font-size:13px; letter-spacing:-0.08em; color:#F5F1E6;">SRjur</span>
    </div>
  </div>

  <div style="display:flex; flex-direction:column; gap:28px; position:relative;">
    <h1 style="margin:0; font-family:'Italiana', serif; font-weight:400; font-size:168px; line-height:0.95; color:var(--cream); letter-spacing:0.03em;">SRJUR</h1>
    <div style="display:flex; align-items:center; gap:18px;">
      <div style="width:60px; height:3px; border-radius:999px; background:linear-gradient(90deg, var(--coral), var(--coral-glow));"></div>
      <p style="margin:0; max-width:560px; line-height:1.3;"><span style="font-size:16px; color:var(--text-2);">Advocacia com</span> <span style="font-family:'Italiana', serif; font-size:28px; color:var(--cream); letter-spacing:0.01em;">clareza</span><span style="font-size:16px; color:var(--text-2);"> — do escritório ao </span><span style="font-size:20px; color:var(--coral-glow);">hub digital</span><span style="font-size:16px; color:var(--text-2);">.</span></p>
    </div>
  </div>

  <div style="display:flex; align-items:baseline; justify-content:space-between; border-top:1px solid rgba(245,241,230,0.14); padding-top:24px; position:relative;">
    <span style="font-size:12px; letter-spacing:0.1em; color:var(--text-2); text-transform:uppercase;">Scartezzini &amp; Rebelo Advocacia</span>
    <span style="font-size:12px; letter-spacing:0.1em; color:var(--text-2); text-transform:uppercase;">Versão 02 · 2026</span>
  </div>
</div>
</x-dc>
</body>
</html>
