<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Italiana&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <style>
    body { margin: 0; }
    a { color: #C7C0B9; } a:hover { color: #E7E5E3; }
  </style>
</helmet>
<div style="--navy:#041542; --navy-2:#1E2E4C; --taupe:#C7C0B9; --cream:#E7E5E3; --wine:#4D102E; width:1200px; height:900px; box-sizing:border-box; background:linear-gradient(160deg, #030F30 0%, #041542 55%, #1E2E4C 100%); font-family:'Plus Jakarta Sans',sans-serif; display:flex; flex-direction:column; justify-content:space-between; padding:80px; position:relative; overflow:hidden;">

  <div style="position:absolute; top:-220px; right:-180px; width:600px; height:600px; border-radius:50%; background:radial-gradient(circle, rgba(199,192,185,0.14), rgba(199,192,185,0) 70%); filter:blur(30px);"></div>
  <div style="position:absolute; bottom:-260px; left:-160px; width:560px; height:560px; border-radius:50%; background:radial-gradient(circle, rgba(77,16,46,0.35), rgba(77,16,46,0) 70%); filter:blur(20px);"></div>

  <div style="display:flex; align-items:center; justify-content:space-between; position:relative;">
    <span style="font-size:12px; font-weight:600; letter-spacing:0.18em; color:var(--taupe); text-transform:uppercase;">Manual de marca</span>
    <span style="font-size:12px; font-weight:600; letter-spacing:0.1em; color:var(--taupe); text-transform:uppercase; opacity:0.7;">Advocacia e Consultoria</span>
  </div>

  <div style="display:flex; flex-direction:column; align-items:center; gap:36px; position:relative;">
    <img src="sr-logo-navy.png" alt="" style="width:220px; height:220px; border-radius:20px;">
    <div style="display:flex; flex-direction:column; align-items:center; gap:10px;">
      <span style="font-family:'Italiana', serif; font-size:46px; color:var(--cream); letter-spacing:0.02em;">Scartezzini &amp; Rebelo</span>
      <span style="font-size:13px; letter-spacing:0.12em; color:var(--taupe); text-transform:uppercase;">Clareza, técnica e elegância desde o primeiro encontro</span>
    </div>
  </div>

  <div style="display:flex; align-items:baseline; justify-content:space-between; border-top:1px solid rgba(231,229,227,0.14); padding-top:24px; position:relative;">
    <span style="font-size:12px; letter-spacing:0.1em; color:var(--taupe); opacity:0.7; text-transform:uppercase;">Marca-mãe do SRJUR</span>
    <span style="font-size:12px; letter-spacing:0.1em; color:var(--taupe); opacity:0.7; text-transform:uppercase;">Versão 01 · 2026</span>
  </div>
</div>
</x-dc>
</body>
</html>
